name: Build Native-libraries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  # =========================
  # BUILD (ALL PLATFORMS)
  # =========================
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - run: sudo apt-get install -y clang zlib1g-dev

      - run: |
          dotnet publish EPBotFFI.csproj -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            --self-contained true

      - uses: actions/upload-artifact@v4
        with:
          name: EPBot-${{ matrix.rid }}
          path: bin/Release/net10.0/${{ matrix.rid }}/publish/libEPBot.so


  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - run: |
          dotnet publish EPBotFFI.csproj -c Release \
            -r osx-arm64 \
            -p:PublishAot=true \
            --self-contained true

      - uses: actions/upload-artifact@v4
        with:
          name: EPBot-osx-arm64
          path: bin/Release/net10.0/osx-arm64/publish/libEPBot.dylib


  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [ win-x64, win-arm64 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - shell: pwsh
        run: |
          dotnet publish EPBotFFI.csproj -c Release `
            -r ${{ matrix.rid }} `
            -p:PublishAot=true `
            --self-contained true `
            -p:DefineConstants=WINDOWS

      - uses: actions/upload-artifact@v4
        with:
          name: EPBot-${{ matrix.rid }}
          path: bin/Release/net10.0/${{ matrix.rid }}/publish/EPBot.dll


  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          echo "WASI_SDK_PATH=$PWD/wasi-sdk-24.0-x86_64-linux" >> $GITHUB_ENV

      - run: dotnet publish EPBotWasm.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: EPBot-wasm
          path: bin/Release/net10.0/wasi-wasm/publish/


  # =========================
  # RELEASE
  # =========================
  release:
    needs: [ build-linux, build-macos, build-windows, build-wasm ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - name: EPBot-linux-x64
            path: linux/x64
          - name: EPBot-linux-arm64
            path: linux/arm64
          - name: EPBot-osx-arm64
            path: macos/arm64
          - name: EPBot-win-x64
            path: windows/x64
          - name: EPBot-win-arm64
            path: windows/arm64
          - name: EPBot-wasm
            path: wasm

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' EPBotFFI.csproj)
          BUILD=${VERSION##*.}
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Set variables
        run: |
          echo "BUILD=${{ steps.version.outputs.build }}" >> $GITHUB_ENV
          echo "FOLDER_PATH=Native-libraries-${{ steps.version.outputs.build }}" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.FOLDER_PATH }}/${{ matrix.path }}

      - name: Zip libraries
        if: ${{ matrix.name == 'EPBot-wasm' }} # tylko raz po ostatnim
        run: |
          ls -lR $FOLDER_PATH
          zip -r EPBot-libraries-$BUILD.zip $FOLDER_PATH/

      - name: Create release
        if: ${{ matrix.name == 'EPBot-wasm' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "EPBot-libraries-$BUILD" --yes 2>/dev/null || true

          gh release create "EPBot-libraries-$BUILD" \
            EPBot-libraries-$BUILD.zip \
            --title "EPBot-libraries-$BUILD" \
            --notes "Automatyczny build z commit ${{ github.sha }}"
